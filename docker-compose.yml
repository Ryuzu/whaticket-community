services:
  mysql:
    image: mariadb:${MYSQL_VERSION:-10.6.22}
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-whaticket}
      MARIADB_USER: ${DB_USER:-whaticket}
      MARIADB_PASSWORD: ${DB_PASSWORD:?MISSING DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MISSING MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - whaticket

  redis:
    image: redis:${REDIS_VERSION:-7.4.2-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - whaticket

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DIALECT: mysql
      DB_NAME: ${MYSQL_DATABASE:-whaticket}
      DB_USER: ${DB_USER:-whaticket}
      DB_PASS: ${DB_PASSWORD:?MISSING DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_DB: ${REDIS_DB:-0}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-wwebjs}
      CHROME_ARGS: ${CHROME_ARGS:---no-sandbox --disable-setuid-sandbox}
      BACKEND_URL: ${BACKEND_URL:?MISSING BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL:?MISSING FRONTEND_URL}
      PROXY_PORT: ${PROXY_PORT:-443}
      JWT_SECRET: ${JWT_SECRET:?MISSING JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?MISSING JWT_REFRESH_SECRET}
      TZ: ${TZ:-UTC}
    volumes:
      - backend_public:/usr/src/app/public
      - backend_auth:/usr/src/app/.wwebjs_auth
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whaticket

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: ${BACKEND_URL:?MISSING BACKEND_URL}
      URL_BACKEND: backend:3000
    command:
      - /bin/sh
      - -ec
      - |
        dockerize -template /etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
        env_json=$$(jq -cn --arg backend "$$VITE_BACKEND_URL" '{"VITE_BACKEND_URL": $$backend}')
        escaped=$$(printf '%s' "$$env_json" | sed 's/[#&]/\\&/g')
        sed -i "s#<noscript id=\"env-insertion-point\"></noscript>#<script>var ENV=$$escaped</script>#" /var/www/public/index.html
        exec nginx -g 'daemon off;'
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - whaticket

volumes:
  mysql_data:
  redis_data:
  backend_public:
  backend_auth:

networks:
  whaticket:
